name: Bug report
description: Report a reproducible problem in IRS Lite.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Do not include account information or SavedVariables files in a public issue.
  - type: input
    id: version
    attributes:
      label: IRS Lite version
      placeholder: "1.0.1"
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: WoW Retail version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the page or setting you used and the actions that caused the problem.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Lua error text
      render: text
  - type: textarea
    id: context
    attributes:
      label: Other addon information
      description: For import problems, include the full IRS version and whether both editions were enabled.
